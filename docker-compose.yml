name: railway-observatory

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No published port, fully internal: the app never used this mapping
    # (api/worker reach postgres:5432 over the Compose network — see the
    # comment below), and the healthcheck's pg_isready runs inside the
    # container regardless of any host port. Direct access is
    # `docker compose exec postgres psql -U ... -d ...` — no port, no
    # SSH tunnel, no exposure at all, not even to 127.0.0.1.
    #
    # This drops local Mac access at 127.0.0.1:5433 (.env.local used
    # that for the bare `npm start`/`npm run worker` processes) — a
    # deliberate loss, not an oversight; pick it back up when .env.local
    # is revisited.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No published port, fully internal, same reasoning as postgres above:
    # api/worker reach redis:6379 over the Compose network, the healthcheck's
    # redis-cli ping runs inside the container, and this Redis has no
    # password, so a host port would be an unauthenticated service one
    # firewall rule away from the internet. Direct access is
    # `docker compose exec redis redis-cli`. Also drops local Mac access at
    # 127.0.0.1:6379 (.env.local) — pick it back up with that file.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # api and worker both build from the repo's own Dockerfile — same image,
  # different command. On the VM, their DATABASE_URL/REDIS_URL (in .env)
  # must point at the service names below (postgres:5432, redis:6379), not
  # 127.0.0.1 — these two are on the same Compose network as postgres/redis
  # and reach them directly, unlike a host-run process using the
  # host-mapped ports above.
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    # Loopback-only: nginx (host-installed, terminates TLS for
    # railway-observatory.duckdns.org) is the only thing meant to be
    # reachable from outside, proxying to 127.0.0.1:3000. Binding to
    # 127.0.0.1 here means 3000 stays unreachable from the internet even
    # if the OCI security list or the VM's iptables rules are ever
    # loosened later.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # migrate deploy (never `migrate dev` — that one's interactive/local-only)
    # applies any pending migrations before the server starts serving.
    command: sh -c "npx prisma migrate deploy && node src/server.js"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node src/jobs/workers/index.js"

volumes:
  postgres_data:
  redis_data:
